    <radialGradient id="glow" cx="512" cy="470" r="400" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset=".45" stop-color="#e08a2a" stop-opacity=".18"/><stop offset="1" stop-color="#e08a2a" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf6b"/><stop offset=".55" stop-color="#ff9a2e"/><stop offset="1" stop-color="#e2531c"/></linearGradient>
    <radialGradient id="core" cx="512" cy="470" r="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fffbe9"/><stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/></radialGradient>
