    <rect x="826" y="440" width="26" height="60" rx="13" opacity=".45"/><rect x="776" y="400" width="26" height="140" rx="13" opacity=".6"/><rect x="726" y="350" width="26" height="240" rx="13" opacity=".75"/><rect x="676" y="410" width="26" height="120" rx="13" opacity=".9"/>
  </g>
